<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-label="Wireframe: the shop profile with the job builder and a live quote">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

  <g stroke="#333" stroke-width="1.2" fill="#f2f2f2">
    <rect x="16" y="16" width="648" height="18" rx="3"/>
  </g>
  <g fill="#999">
    <circle cx="28" cy="25" r="2.6"/><circle cx="38" cy="25" r="2.6"/><circle cx="48" cy="25" r="2.6"/>
  </g>
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="16" y="34" width="648" height="34"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="56" font-size="12" font-weight="bold" fill="#1a1a1a">TarpaLink</text>
    <text x="560" y="55" font-size="8.5" fill="#555">Back to shops</text>
    <text x="625" y="55" font-size="8.5" fill="#1a1a1a">My account</text>
  </g>

  <!-- shop identity -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Inkwell Press</text>
    <text x="32" y="114" font-size="8.5" fill="#555">Quezon City · 4.8 from 214 collected jobs · opens 8:00 AM</text>
    <text x="32" y="128" font-size="8.5" fill="#555">Tarpaulin · stickers · flyers · DTF shirts</text>
  </g>

  <!-- services list -->
  <g stroke="#333" stroke-width="1.2" fill="#f7f7f7">
    <rect x="32" y="144" width="300" height="244" rx="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#555">
    <text x="44" y="162" font-weight="bold" fill="#1a1a1a">What this shop prints</text>
  </g>
  <g stroke="#ccc" stroke-width="1" fill="#ffffff">
    <rect x="44" y="172" width="276" height="50" rx="2"/>
    <rect x="44" y="230" width="276" height="50" rx="2"/>
    <rect x="44" y="288" width="276" height="50" rx="2"/>
    <rect x="44" y="346" width="276" height="30" rx="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="190" font-size="9" font-weight="bold" fill="#1a1a1a">Tarpaulin</text>
    <text x="54" y="204" font-size="7.8" fill="#555">priced by the square foot · 3 size tiers</text>
    <text x="54" y="216" font-size="8" fill="#1a1a1a">from ₱180.00 / sq ft</text>
    <text x="54" y="248" font-size="9" font-weight="bold" fill="#1a1a1a">Stickers</text>
    <text x="54" y="262" font-size="7.8" fill="#555">priced per piece · 4 size tiers</text>
    <text x="54" y="274" font-size="8" fill="#1a1a1a">from ₱25.00 / pc</text>
    <text x="54" y="306" font-size="9" font-weight="bold" fill="#1a1a1a">Flyers</text>
    <text x="54" y="320" font-size="7.8" fill="#555">priced per piece · 2 size tiers</text>
    <text x="54" y="332" font-size="8" fill="#1a1a1a">from ₱8.00 / pc</text>
    <text x="54" y="365" font-size="7.8" fill="#555">Every price above comes from this shop's own matrix.</text>
  </g>

  <!-- builder -->
  <g stroke="#333" stroke-width="1.4" fill="#ffffff">
    <rect x="348" y="144" width="316" height="244" rx="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="362" y="164" font-size="10" font-weight="bold" fill="#1a1a1a">Configure your job</text>
  </g>
  <g stroke="#bbb" stroke-width="1" fill="#ffffff">
    <rect x="362" y="174" width="140" height="24" rx="2"/>
    <rect x="362" y="214" width="88" height="24" rx="2"/>
    <rect x="460" y="214" width="88" height="24" rx="2"/>
    <rect x="362" y="254" width="88" height="24" rx="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#777">
    <text x="362" y="172">Service</text>
    <text x="362" y="212">Width (ft)</text>
    <text x="460" y="212">Height (ft)</text>
    <text x="362" y="252">Quantity</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#1a1a1a">
    <text x="370" y="190">Tarpaulin</text>
    <text x="370" y="230">4</text>
    <text x="468" y="230">6</text>
    <text x="370" y="270">1</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#555">
    <text x="362" y="292">Finishing</text>
  </g>
  <g stroke="#333" stroke-width="1" fill="#ffffff">
    <rect x="362" y="298" width="10" height="10"/>
    <rect x="440" y="298" width="10" height="10"/>
    <rect x="518" y="298" width="10" height="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#1a1a1a">
    <text x="378" y="307">Eyelets +₱40</text>
    <text x="456" y="307">Hemming +₱60</text>
    <text x="534" y="307">Rush +₱150</text>
  </g>

  <!-- live quote -->
  <g stroke="#333" stroke-width="1.2" fill="#f2f2f2">
    <rect x="362" y="320" width="288" height="40" rx="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="372" y="334" font-size="7.5" fill="#555">Your price, computed on the server</text>
    <text x="372" y="352" font-size="15" font-weight="bold" fill="#1a1a1a">₱4,440.00</text>
    <text x="470" y="352" font-size="7.5" fill="#555">24 sq ft × ₱180.00 + ₱60.00 hemming</text>
  </g>
  <g stroke="#333" stroke-width="1.2" fill="#333">
    <rect x="540" y="334" width="100" height="20" rx="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">
    <text x="590" y="348">Continue</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#777">
    <text x="362" y="376">Renders without JavaScript as a plain form; the total is re-checked at checkout.</text>
  </g>
</svg>
