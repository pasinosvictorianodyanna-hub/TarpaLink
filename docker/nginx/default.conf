# Behind a TLS terminator this container is not the edge, and PHP never learns
# the original scheme: `route()` then builds http:// links for proofs, password
# resets and invitations, which is the same failure as the loopback-invitation
# bug in a different disguise. `fastcgi_params` forwards no X-Forwarded-*, so
# they are passed explicitly below.
#
# `map` rather than `$http_x_forwarded_proto` directly: an empty value would be
# forwarded as a present-but-blank header. When nothing sets it — the default
# single-container setup — this falls back to the actual scheme, which is http.
#
# Harmless when unused: Laravel ignores X-Forwarded-* unless TRUSTED_PROXIES is
# set in .env.
map $http_x_forwarded_proto $tarpalink_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Logs go to stdout/stderr so `docker logs` is the only place to look.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # The scheme as the client saw it, and the client's own address. Both
        # only take effect once TRUSTED_PROXIES names the proxy.
        fastcgi_param HTTP_X_FORWARDED_PROTO $tarpalink_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;

        fastcgi_hide_header X-Powered-By;
    }

    # Cached assets are matched by directory, never by file extension.
    #
    # A rule like `location ~* \.js$ { try_files $uri =404; }` looks equivalent
    # and is not: it also catches `/livewire/livewire.min.js`, which Livewire
    # serves through a route rather than a file on disk. nginx answered 404, the
    # script never loaded, Alpine never booted, and every panel page rendered
    # blank behind its x-cloak — with a 200 status and nothing in the log.
    location ^~ /build/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(js|css|fonts)/filament/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
