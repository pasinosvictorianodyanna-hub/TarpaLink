<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-label="Wireframe: the storefront directory with a shop list and a map">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

  <!-- browser chrome -->
  <g stroke="#333" stroke-width="1.2" fill="#f2f2f2">
    <rect x="16" y="16" width="648" height="18" rx="3"/>
  </g>
  <g fill="#999">
    <circle cx="28" cy="25" r="2.6"/><circle cx="38" cy="25" r="2.6"/><circle cx="48" cy="25" r="2.6"/>
  </g>

  <!-- site header -->
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="16" y="34" width="648" height="34"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="56" font-size="12" font-weight="bold" fill="#1a1a1a">TarpaLink</text>
    <text x="470" y="55" font-size="8.5" fill="#555">Shops</text>
    <text x="510" y="55" font-size="8.5" fill="#555">How it works</text>
    <text x="575" y="55" font-size="8.5" fill="#555">Sign in</text>
    <text x="620" y="55" font-size="8.5" fill="#1a1a1a">Open a shop</text>
  </g>

  <!-- search and filters -->
  <g stroke="#333" stroke-width="1.1" fill="#ffffff">
    <rect x="32" y="80" width="290" height="28" rx="14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#777">
    <text x="46" y="98">Search a shop, a city, or a service</text>
  </g>
  <g stroke="#333" stroke-width="1.1" fill="#ffffff">
    <rect x="336" y="80" width="66" height="28" rx="14"/>
    <rect x="410" y="80" width="62" height="28" rx="14"/>
    <rect x="480" y="80" width="70" height="28" rx="14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555" text-anchor="middle">
    <text x="369" y="98">Quezon City</text>
    <text x="441" y="98">Makati</text>
    <text x="515" y="98">Pasig</text>
  </g>

  <!-- result count -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">
    <text x="32" y="128">7 shops · nearest first</text>
  </g>

  <!-- shop cards -->
  <g stroke="#333" stroke-width="1.1" fill="#ffffff">
    <rect x="32" y="136" width="368" height="78" rx="3"/>
    <rect x="32" y="224" width="368" height="78" rx="3"/>
    <rect x="32" y="312" width="368" height="78" rx="3"/>
  </g>
  <g stroke="#bbb" stroke-width="1" fill="#f2f2f2">
    <rect x="42" y="146" width="56" height="56"/>
    <rect x="42" y="234" width="56" height="56"/>
    <rect x="42" y="322" width="56" height="56"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="160" font-size="10" font-weight="bold" fill="#1a1a1a">Inkwell Press</text>
    <text x="110" y="174" font-size="8" fill="#555">Quezon City · 4.8 · 214 jobs collected</text>
    <text x="110" y="188" font-size="8" fill="#555">Tarpaulin, stickers, flyers</text>
    <text x="110" y="202" font-size="9" fill="#1a1a1a">from ₱180.00 / sq ft</text>
    <text x="110" y="248" font-size="10" font-weight="bold" fill="#1a1a1a">Halftone Hub</text>
    <text x="110" y="262" font-size="8" fill="#555">Makati · 4.6 · 138 jobs collected</text>
    <text x="110" y="276" font-size="8" fill="#555">DTF shirts, stickers</text>
    <text x="110" y="290" font-size="9" fill="#1a1a1a">from ₱95.00 / pc</text>
    <text x="110" y="336" font-size="10" font-weight="bold" fill="#1a1a1a">Studio Sampaguita</text>
    <text x="110" y="350" font-size="8" fill="#555">Pasig · 4.9 · 96 jobs collected</text>
    <text x="110" y="364" font-size="8" fill="#555">Tarpaulin, flyers</text>
    <text x="110" y="378" font-size="9" fill="#1a1a1a">from ₱150.00 / sq ft</text>
  </g>
  <g stroke="#333" stroke-width="1.1" fill="#f2f2f2">
    <rect x="306" y="184" width="82" height="20" rx="3"/>
    <rect x="306" y="272" width="82" height="20" rx="3"/>
    <rect x="306" y="360" width="82" height="20" rx="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle">
    <text x="347" y="198">View shop</text>
    <text x="347" y="286">View shop</text>
    <text x="347" y="374">View shop</text>
  </g>

  <!-- map -->
  <g stroke="#333" stroke-width="1.2" fill="#f7f7f7">
    <rect x="412" y="136" width="252" height="254" rx="3"/>
  </g>
  <g stroke="#ccc" stroke-width="0.8" fill="none">
    <path d="M 412 190 L 664 190"/>
    <path d="M 412 250 L 664 250"/>
    <path d="M 412 310 L 664 310"/>
    <path d="M 470 136 L 470 390"/>
    <path d="M 540 136 L 540 390"/>
    <path d="M 610 136 L 610 390"/>
  </g>
  <g fill="#333">
    <circle cx="470" cy="196" r="4"/>
    <circle cx="560" cy="252" r="4"/>
    <circle cx="505" cy="330" r="4"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">
    <text x="424" y="152">Map · measured from your address</text>
    <text x="424" y="378">tiles degrade to a labelled panel offline</text>
  </g>
</svg>
