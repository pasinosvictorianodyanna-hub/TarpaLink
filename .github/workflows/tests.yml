name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, gd, intl, bcmath, fileinfo
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # public/build is gitignored and the layouts call @vite(), so the suite
      # needs a real manifest — without it the homepage test fails on a fresh
      # clone even though nothing is wrong with the code.
      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run the test suite
        run: php artisan test

  issue-link:
    name: Issue link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # A pull request with no issue number is a pull request nobody can place.
      # The template asks for one; this makes it a rule instead of a hope.
      - name: The PR must reference the issue it fixes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body ?? ''}`;
            const references = text.match(/#\d+/g);

            if (!references) {
              core.setFailed(
                'No issue referenced. Put "Closes #7" in the description, or the issue number in the title.'
              );
              return;
            }

            core.info(`Referenced: ${[...new Set(references)].join(', ')}`);
