# Docker deployment for TarpaLink.
#
#   cp .env.docker.example .env      # then fill in APP_KEY and secrets
#   docker compose up -d --build
#
# Three services, and all three matter:
#   app     nginx + php-fpm, serves HTTP and runs migrations on first boot
#   worker  the queue worker — without it PayMongo callbacks never settle
#   db      MySQL 8

services:
  app:
    build:
      context: .
    image: tarpalink:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # The web process owns schema changes; the worker must not race it.
      RUN_MIGRATIONS: "true"
      # Container logs, not files inside the image.
      LOG_STACK: stderr
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
    image: tarpalink:local
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "false"
      LOG_STACK: stderr
    depends_on:
      db:
        condition: service_healthy
      # healthy, not started: the app runs migrations on boot, and a worker that
      # starts first dies on "Table 'queue_jobs' doesn't exist" and crash-loops
      # until the schema catches up.
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-tarpalink}"
      MYSQL_USER: "${DB_USERNAME:-tarpalink}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  dbdata:
