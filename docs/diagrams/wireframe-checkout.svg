<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="Wireframe: checkout, with the customer details form on the left and the total and payment action on the right">
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>

  <g stroke="#333" stroke-width="1.2" fill="#f2f2f2">
    <rect x="16" y="16" width="648" height="18" rx="3"/>
  </g>
  <g fill="#999">
    <circle cx="28" cy="25" r="2.6"/><circle cx="38" cy="25" r="2.6"/><circle cx="48" cy="25" r="2.6"/>
  </g>
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="16" y="34" width="648" height="34"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="56" font-size="12" font-weight="bold" fill="#1a1a1a">TarpaLink</text>
    <text x="556" y="55" font-size="8.5" fill="#555">Inkwell Press · checkout</text>
  </g>

  <!-- step rail -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#555">
    <text x="32" y="90">1 · Configure</text>
    <text x="132" y="90" fill="#1a1a1a" font-weight="bold">2 · Details and payment</text>
    <text x="300" y="90">3 · Proof and collection</text>
  </g>
  <g stroke="#ccc" stroke-width="1">
    <line x1="32" y1="96" x2="648" y2="96"/>
  </g>
  <g stroke="#333" stroke-width="2">
    <line x1="32" y1="96" x2="290" y2="96"/>
  </g>

  <!-- details -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="120" font-size="10" font-weight="bold" fill="#1a1a1a">Your details</text>
  </g>
  <g stroke="#bbb" stroke-width="1" fill="#ffffff">
    <rect x="32" y="130" width="176" height="26" rx="2"/>
    <rect x="220" y="130" width="176" height="26" rx="2"/>
    <rect x="32" y="182" width="176" height="26" rx="2"/>
    <rect x="220" y="182" width="176" height="26" rx="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7.2" fill="#777">
    <text x="32" y="128">Full name</text>
    <text x="220" y="128">Mobile number</text>
    <text x="32" y="180">Email</text>
    <text x="220" y="180">Pickup area</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#1a1a1a">
    <text x="40" y="147">Maria Santos</text>
    <text x="228" y="147">0917 000 0000</text>
    <text x="40" y="199">maria@example.ph</text>
    <text x="228" y="199">Quezon City</text>
  </g>

  <!-- order lines -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="238" font-size="10" font-weight="bold" fill="#1a1a1a">What you are ordering</text>
  </g>
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="32" y="248" width="364" height="106" rx="2"/>
  </g>
  <g stroke="#ddd" stroke-width="0.8">
    <line x1="32" y1="290" x2="396" y2="290"/>
    <line x1="32" y1="320" x2="396" y2="320"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#1a1a1a">
    <text x="44" y="266">Tarpaulin · 4 × 6 ft · quantity 1</text>
    <text x="330" y="266">₱4,320.00</text>
    <text x="44" y="282" font-size="7.2" fill="#777">24 sq ft at ₱180.00 per sq ft</text>
    <text x="44" y="308">Hemming</text>
    <text x="330" y="308">₱60.00</text>
    <text x="44" y="338" font-weight="bold">Total, as quoted</text>
    <text x="322" y="338" font-weight="bold">₱4,380.00</text>
  </g>

  <!-- payment panel -->
  <g stroke="#333" stroke-width="1.4" fill="#f7f7f7">
    <rect x="412" y="248" width="236" height="106" rx="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="424" y="268" font-size="7.5" fill="#555">Amount to pay</text>
    <text x="424" y="288" font-size="16" font-weight="bold" fill="#1a1a1a">₱4,380.00</text>
  </g>
  <g stroke="#333" stroke-width="1.2" fill="#333">
    <rect x="424" y="298" width="212" height="24" rx="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">
    <text x="530" y="314">Pay with PayMongo</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7.2" fill="#777">
    <text x="424" y="338">You leave the site for the processor and come back to this job.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#777">
    <text x="32" y="378">The form submits and validates without a page reload, shows an error beside the field that caused it, and still works as a plain POST when the bundle does not load.</text>
  </g>
</svg>
