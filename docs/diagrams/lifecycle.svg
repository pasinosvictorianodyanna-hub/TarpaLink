<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-label="State diagram of the job lifecycle, with cancellation reachable from the first three states">
  <defs>
    <marker id="ar-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="290" fill="#ffffff"/>

  <g stroke="#333" stroke-width="1.3" fill="#f2f2f2">
    <rect x="40" y="80" width="110" height="40" rx="14"/>
    <rect x="210" y="80" width="130" height="40" rx="14"/>
    <rect x="400" y="80" width="110" height="40" rx="14"/>
    <rect x="40" y="200" width="120" height="40" rx="14"/>
    <rect x="220" y="200" width="90" height="40" rx="14"/>
    <rect x="370" y="200" width="120" height="40" rx="14"/>
    <rect x="560" y="80" width="110" height="40" rx="14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">
    <text x="95" y="105">quoted</text>
    <text x="275" y="105">awaiting_proof</text>
    <text x="455" y="105">approved</text>
    <text x="100" y="225">in_production</text>
    <text x="265" y="225">ready</text>
    <text x="430" y="225">collected</text>
    <text x="615" y="105">cancelled</text>
  </g>

  <g stroke="#333" stroke-width="1.1" fill="none">
    <path d="M 150 100 L 204 100" marker-end="url(#ar-life)"/>
    <path d="M 340 100 L 394 100" marker-end="url(#ar-life)"/>
    <path d="M 455 120 L 455 155 L 100 155 L 100 194" marker-end="url(#ar-life)"/>
    <path d="M 160 220 L 214 220" marker-end="url(#ar-life)"/>
    <path d="M 310 220 L 364 220" marker-end="url(#ar-life)"/>
    <path d="M 95 80 L 95 46 L 615 46 L 615 74" marker-end="url(#ar-life)"/>
    <path d="M 275 80 L 275 34 L 640 34 L 640 74" marker-end="url(#ar-life)"/>
    <path d="M 510 100 L 554 100" marker-end="url(#ar-life)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="7.6" fill="#555" text-anchor="middle">
    <text x="177" y="94">payment settles</text>
    <text x="367" y="94">proof approved</text>
    <text x="187" y="214">shop finishes</text>
    <text x="337" y="214">marks collected</text>
    <text x="240" y="149">shop starts work</text>
    <text x="380" y="26">cancel — refunded in full, and refused once material is committed</text>
    <text x="532" y="94">refused</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="7.6" fill="#777">
    <text x="40" y="272">A move is written to job_activities by JobWorkflow; an illegal move raises rather than silently doing nothing.</text>
  </g>
</svg>
