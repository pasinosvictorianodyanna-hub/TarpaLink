<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img" aria-label="Architecture diagram: three surfaces, four layers, three data stores and three external services">
  <defs>
    <marker id="ar-arch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="560" fill="#ffffff"/>

  <!-- surfaces -->
  <g stroke="#333" stroke-width="1.2" fill="#f2f2f2">
    <rect x="30" y="28" width="200" height="64" rx="3"/>
    <rect x="240" y="28" width="200" height="64" rx="3"/>
    <rect x="450" y="28" width="200" height="64" rx="3"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="130" y="50" font-size="10.5" font-weight="bold">Storefront</text>
    <text x="130" y="66" font-size="8.5" fill="#555">Blade + 4 Vue islands</text>
    <text x="130" y="80" font-size="8.5" fill="#555">ships no JS on the landing page</text>
    <text x="340" y="50" font-size="10.5" font-weight="bold">Shop console</text>
    <text x="340" y="66" font-size="8.5" fill="#555">Blade shell, server-rendered</text>
    <text x="340" y="80" font-size="8.5" fill="#555">no client runtime</text>
    <text x="550" y="50" font-size="10.5" font-weight="bold">Admin panel</text>
    <text x="550" y="66" font-size="8.5" fill="#555">Filament v4 on Livewire</text>
    <text x="550" y="80" font-size="8.5" fill="#555">administrators only</text>
  </g>
  <g fill="#555" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="8">
    <text x="250" y="106">HTTPS</text>
  </g>
  <g stroke="#333" stroke-width="1.1" fill="none">
    <path d="M 130 92 L 130 116 L 250 116 L 250 124" marker-end="url(#ar-arch)"/>
    <path d="M 340 92 L 340 124" marker-end="url(#ar-arch)"/>
    <path d="M 550 92 L 550 116 L 250 116"/>
  </g>

  <!-- the four layers -->
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="30" y="126" width="440" height="64" rx="3"/>
    <rect x="30" y="198" width="440" height="64" rx="3"/>
    <rect x="30" y="270" width="440" height="64" rx="3"/>
    <rect x="30" y="342" width="440" height="64" rx="3"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="150" font-size="10" font-weight="bold">Presentation</text>
    <text x="44" y="166" font-size="8" fill="#555">what the actor sees</text>
    <text x="44" y="222" font-size="10" font-weight="bold">Application</text>
    <text x="44" y="238" font-size="8" fill="#555">one request, one route</text>
    <text x="44" y="294" font-size="10" font-weight="bold">Domain</text>
    <text x="44" y="310" font-size="8" fill="#555">the five decisions</text>
    <text x="44" y="366" font-size="10" font-weight="bold">Persistence</text>
    <text x="44" y="382" font-size="8" fill="#555">the only writer</text>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" font-size="8.8">
    <text x="150" y="146">Blade views · Vue islands · console shell · Filament resources</text>
    <text x="150" y="162" fill="#555">must not contain business rules or SQL</text>
    <text x="150" y="218">Route handlers · form requests · 16 policies · middleware</text>
    <text x="150" y="234" fill="#555">must not contain SQL or HTML</text>
    <text x="150" y="290">PriceCalculator · JobWorkflow · Billing · PayMongo · Notifier</text>
    <text x="150" y="306" fill="#555">must not know about HTTP or views</text>
    <text x="150" y="362">Eloquent models · query scopes · migrations · transactions</text>
    <text x="150" y="378" fill="#555">must not make authorisation decisions</text>
  </g>

  <g stroke="#333" stroke-width="1.1" fill="none">
    <path d="M 250 190 L 250 196" marker-end="url(#ar-arch)"/>
    <path d="M 250 262 L 250 268" marker-end="url(#ar-arch)"/>
    <path d="M 250 334 L 250 340" marker-end="url(#ar-arch)"/>
  </g>

  <!-- data stores -->
  <g stroke="#333" stroke-width="1.2" fill="#f2f2f2">
    <rect x="30" y="440" width="140" height="72" rx="3"/>
    <rect x="180" y="440" width="140" height="72" rx="3"/>
    <rect x="330" y="440" width="140" height="72" rx="3"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="100" y="462" font-size="10" font-weight="bold">TiDB / MySQL</text>
    <text x="100" y="478" font-size="8.5" fill="#555">19 tables, integer centavos</text>
    <text x="100" y="492" font-size="8.5" fill="#555">TLS, one connection</text>
    <text x="250" y="462" font-size="10" font-weight="bold">Cloudflare R2</text>
    <text x="250" y="478" font-size="8.5" fill="#555">proofs and artwork</text>
    <text x="250" y="492" font-size="8.5" fill="#555">private, streamed by route</text>
    <text x="400" y="462" font-size="10" font-weight="bold">database driver</text>
    <text x="400" y="478" font-size="8.5" fill="#555">sessions, cache, locks</text>
    <text x="400" y="492" font-size="8.5" fill="#555">no worker required</text>
  </g>
  <g stroke="#333" stroke-width="1.1" fill="none">
    <path d="M 100 438 L 100 410" marker-end="url(#ar-arch)"/>
    <path d="M 250 438 L 250 410" marker-end="url(#ar-arch)"/>
    <path d="M 400 438 L 400 410" marker-end="url(#ar-arch)"/>
  </g>

  <!-- external services -->
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="495" y="134" width="165" height="52" rx="3"/>
    <rect x="495" y="240" width="165" height="52" rx="3"/>
    <rect x="495" y="346" width="165" height="52" rx="3"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="577" y="155" font-size="10" font-weight="bold">PayMongo</text>
    <text x="577" y="170" font-size="8.5" fill="#555">intent out, webhook in</text>
    <text x="577" y="261" font-size="10" font-weight="bold">SMTP relay</text>
    <text x="577" y="276" font-size="8.5" fill="#555">six notifications, best-effort</text>
    <text x="577" y="367" font-size="10" font-weight="bold">Nominatim · tiles</text>
    <text x="577" y="382" font-size="8.5" fill="#555">geocode, 30-day cache</text>
  </g>
  <g stroke="#333" stroke-width="1.1" fill="none">
    <path d="M 470 302 L 482 302 L 482 160 L 493 160" marker-end="url(#ar-arch)"/>
    <path d="M 482 266 L 493 266" marker-end="url(#ar-arch)"/>
    <path d="M 482 372 L 493 372" marker-end="url(#ar-arch)"/>
  </g>
</svg>
