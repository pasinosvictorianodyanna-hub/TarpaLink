<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" width="680" height="660" role="img" aria-label="Use case diagram: customer and shop use cases inside the system boundary">
  <rect x="0" y="0" width="680" height="660" fill="#ffffff"/>

  <!-- system boundary -->
  <g stroke="#333" stroke-width="1.3" fill="#fbfbfb">
    <rect x="165" y="30" width="390" height="610" rx="4"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="360" y="54" font-size="10.5" font-weight="bold">TarpaLink — storefront and shop console</text>
  </g>

  <!-- customer use cases -->
  <g stroke="#333" stroke-width="1.1" fill="#ffffff">
    <ellipse cx="360" cy="88" rx="178" ry="16"/>
    <ellipse cx="360" cy="130" rx="178" ry="16"/>
    <ellipse cx="360" cy="172" rx="178" ry="16"/>
    <ellipse cx="360" cy="214" rx="178" ry="16"/>
    <ellipse cx="360" cy="256" rx="178" ry="16"/>
    <ellipse cx="360" cy="298" rx="178" ry="16"/>
    <ellipse cx="360" cy="340" rx="178" ry="16"/>
    <ellipse cx="360" cy="382" rx="178" ry="16"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="9.5">
    <text x="360" y="91">Browse the shop directory</text>
    <text x="360" y="133">Open a shop profile and see its prices</text>
    <text x="360" y="175">Build a job and see the price</text>
    <text x="360" y="217">Place the order</text>
    <text x="360" y="259">Pay for the job</text>
    <text x="360" y="301">Send the design file</text>
    <text x="360" y="343">Approve or reject the proof</text>
    <text x="360" y="385">Track the job and read its receipt</text>
  </g>

  <!-- shop use cases -->
  <g stroke="#333" stroke-width="1.1" fill="#ffffff">
    <ellipse cx="360" cy="424" rx="178" ry="16"/>
    <ellipse cx="360" cy="466" rx="178" ry="16"/>
    <ellipse cx="360" cy="508" rx="178" ry="16"/>
    <ellipse cx="360" cy="550" rx="178" ry="16"/>
    <ellipse cx="360" cy="592" rx="178" ry="16"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="9.5">
    <text x="360" y="427">Work the job queue</text>
    <text x="360" y="469">Move a job on the production board</text>
    <text x="360" y="511">Send a proof to the customer</text>
    <text x="360" y="553">Maintain the price matrix</text>
    <text x="360" y="595">Read reports and export the ledger</text>
  </g>

  <!-- group rules -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="5 4">
    <line x1="176" y1="404" x2="544" y2="404"/>
  </g>

  <!-- actors -->
  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="20" y="212" width="120" height="46" rx="3"/>
    <rect x="20" y="445" width="120" height="46" rx="3"/>
    <rect x="20" y="545" width="120" height="46" rx="3"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="80" y="232" font-size="10.5" font-weight="bold">Customer</text>
    <text x="80" y="247" font-size="8.5" fill="#555">visitor until checkout</text>
    <text x="80" y="465" font-size="10.5" font-weight="bold">Shop staff</text>
    <text x="80" y="480" font-size="8.5" fill="#555">no prices, no billing</text>
    <text x="80" y="565" font-size="10.5" font-weight="bold">Shop owner</text>
    <text x="80" y="580" font-size="8.5" fill="#555">one or more shops</text>
  </g>

  <!-- associations -->
  <g stroke="#333" stroke-width="0.9" fill="none">
    <line x1="140" y1="228" x2="182" y2="92"/>
    <line x1="140" y1="232" x2="182" y2="132"/>
    <line x1="140" y1="236" x2="182" y2="172"/>
    <line x1="140" y1="238" x2="182" y2="214"/>
    <line x1="140" y1="240" x2="182" y2="256"/>
    <line x1="140" y1="243" x2="182" y2="298"/>
    <line x1="140" y1="246" x2="182" y2="340"/>
    <line x1="140" y1="250" x2="182" y2="382"/>
    <line x1="140" y1="458" x2="182" y2="424"/>
    <line x1="140" y1="462" x2="182" y2="466"/>
    <line x1="140" y1="552" x2="182" y2="424"/>
    <line x1="140" y1="556" x2="182" y2="466"/>
    <line x1="140" y1="562" x2="182" y2="508"/>
    <line x1="140" y1="568" x2="182" y2="550"/>
    <line x1="140" y1="574" x2="182" y2="592"/>
  </g>
</svg>
