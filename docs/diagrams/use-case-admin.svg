<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-label="Use case diagram: administration use cases and the two platform-initiated ones">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

  <g stroke="#333" stroke-width="1.3" fill="#fbfbfb">
    <rect x="165" y="30" width="390" height="356" rx="4"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="360" y="54" font-size="10.5" font-weight="bold">TarpaLink — administration and platform</text>
  </g>

  <g stroke="#333" stroke-width="1.1" fill="#ffffff">
    <ellipse cx="360" cy="82" rx="178" ry="16"/>
    <ellipse cx="360" cy="120" rx="178" ry="16"/>
    <ellipse cx="360" cy="158" rx="178" ry="16"/>
    <ellipse cx="360" cy="196" rx="178" ry="16"/>
    <ellipse cx="360" cy="234" rx="178" ry="16"/>
    <ellipse cx="360" cy="272" rx="178" ry="16"/>
    <ellipse cx="360" cy="318" rx="178" ry="16"/>
    <ellipse cx="360" cy="356" rx="178" ry="16"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="9.5">
