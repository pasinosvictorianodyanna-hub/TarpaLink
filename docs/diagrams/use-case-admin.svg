    <line x1="140" y1="170" x2="182" y2="122"/>
    <line x1="140" y1="174" x2="182" y2="160"/>
    <line x1="140" y1="178" x2="182" y2="198"/>
    <line x1="140" y1="182" x2="182" y2="236"/>
    <line x1="140" y1="186" x2="182" y2="274"/>
    <line x1="555" y1="313" x2="538" y2="320"/>
