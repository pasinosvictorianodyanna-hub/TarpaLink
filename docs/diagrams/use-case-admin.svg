    <text x="360" y="123">Suspend or reinstate a shop</text>
    <text x="360" y="161">Manage users and roles</text>
    <text x="360" y="199">Edit site content</text>
    <text x="360" y="237">Change a rotating credential</text>
    <text x="360" y="275">Review platform money and volume</text>
    <text x="360" y="321">Settle a payment</text>
    <text x="360" y="359">File an inbound reply</text>
