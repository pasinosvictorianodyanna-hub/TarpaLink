  <g stroke="#bbb" stroke-width="1" stroke-dasharray="5 4">
    <line x1="176" y1="296" x2="544" y2="296"/>
  </g>

  <g stroke="#333" stroke-width="1.2" fill="#ffffff">
    <rect x="20" y="150" width="120" height="46" rx="3"/>
    <rect x="555" y="292" width="110" height="42" rx="3"/>
    <rect x="555" y="338" width="110" height="42" rx="3"/>
  </g>
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="80" y="170" font-size="10.5" font-weight="bold">Administrator</text>
    <text x="80" y="185" font-size="8.5" fill="#555">Filament panel</text>
    <text x="610" y="310" font-size="10" font-weight="bold">PayMongo</text>
    <text x="610" y="323" font-size="8" fill="#555">signed webhook</text>
    <text x="610" y="356" font-size="10" font-weight="bold">Mail provider</text>
    <text x="610" y="369" font-size="8" fill="#555">forwarded reply</text>
  </g>

