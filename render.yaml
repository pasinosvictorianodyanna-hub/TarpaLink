# Render Blueprint for the free compute plan.
#
# Read docs/DEPLOY-RENDER.md before using this. The free plan gives you one web
# service and nothing else, and three things this application needs are not
# available at any price on that plan: a queue worker, a scheduler, and a disk
# that survives a restart. The blueprint configures around all three — the
# worker and the scheduler by moving their work into the request and the boot
# hook, the disk by not using it: uploads go to Cloudflare R2, and the database
# to TiDB Cloud, because Render offers neither MySQL nor persistent storage.
#
# What is deliberately absent:
#   * a `worker` service      — free plans cannot run background workers.
#                               QUEUE_CONNECTION=sync settles the PayMongo
#                               webhook inside the request instead.
#   * a `cron` job            — free plans cannot run cron jobs. `billing:issue`
#                               therefore never fires; see the doc.
#   * a `databases` block     — Render does not offer MySQL at all, free or paid.
#
# `sync: false` means "no value here on purpose" — Render prompts for it in the
# dashboard and stores it as a secret. Never commit a real key to this file.

services:
  - type: web
    name: tarpalink
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TarpaLink
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      # Set this to the onrender.com URL once the service exists, or emailed
      # links point at localhost. It cannot be derived from the blueprint: the
      # subdomain is assigned at creation.
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DB_TIMEZONE
        value: "+08:00"

      # Render terminates TLS at its load balancer and forwards plain HTTP, so
      # without this every generated URL is http:// and every session cookie is
      # issued for the wrong scheme. `*` is acceptable here and nowhere else:
      # the container is not reachable except through Render's proxy.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_SECURE_COOKIE
        value: "true"

      # An external MySQL. Render offers Postgres only, and its free Postgres is
      # deleted 44 days after creation. docs/DEPLOY-RENDER.md lists the options.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # A certificate file, not a certificate. TiDB Cloud — the free MySQL-
      # compatible option docs/DEPLOY-RENDER.md recommends — refuses a plaintext
      # connection and signs with a CA of its own, so PDO needs a *path*.
      #
      # A Render environment variable can only hold a string, so paste the
      # certificate's contents into DB_SSL_CA_PEM: the entrypoint writes them to
      # /etc/ssl/certs/db-ca.pem and points MYSQL_ATTR_SSL_CA at that file before
      # the config cache is built. Leave it empty and set MYSQL_ATTR_SSL_CA
      # yourself if you would rather mount the certificate as a Secret File — an
      # explicit MYSQL_ATTR_SSL_CA always wins.
      - key: DB_SSL_CA_PEM
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false

      # The filesystem is wiped on every redeploy, restart and spin-down, so
      # file sessions would log every user out after 15 idle minutes. Both of
      # these live in the database, which survives.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

      # No worker on a free plan. `sync` runs the job inside the webhook request,
      # which is the only way settlement happens without one.
      - key: QUEUE_CONNECTION
        value: sync

      # Logs go to the platform's log stream; there is no shell to read a file.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # Cloudflare R2 (S3-compatible, 10 GB free) rather than the ephemeral
      # disk. Without this every proof and every customer artwork — artwork
      # follows the proof disk since #100 — is deleted on the next redeploy,
      # restart or spin-down, which on the free plan means after fifteen idle
      # minutes.
      #
      # R2 differs from S3 in three ways, and each is one line below: it needs
      # an explicit endpoint, it needs path-style addressing, and it answers to
      # the region `auto`. Nothing in the code changes — both disks already read
      # this block, and proofs and artwork are streamed through a controller, so
      # the bucket stays private and AWS_URL is not needed.
      - key: FILESYSTEM_DISK
        value: s3
      - key: PROOF_DISK_DRIVER
        value: s3
      # Artwork follows the proof disk unless ARTWORK_DISK_DRIVER splits them.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET
        sync: false
      # https://<account-id>.r2.cloudflarestorage.com
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # No shell and no one-off jobs on a free plan, so migrations and the
      # reference data ride on the boot. ProductionSeeder is updateOrCreate
      # throughout, so re-seeding on every start changes nothing.
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEEDER
        value: "true"
      # No cron on a free plan, so billing rides on the boot. `billing:issue` is
      # idempotent by period, not by clock (#83), and a free instance boots on
      # the first request after every spin-down — so this bills more reliably
      # than a nightly job would. The one hole: a service that gets no traffic
      # for a whole month never boots, and that month is never invoiced.
      - key: RUN_BILLING
        value: "true"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Render blocks outbound SMTP (25, 465, 587) on every plan, so the mailer
      # has to be an HTTP API or `log`. See the doc.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: TarpaLink

      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
