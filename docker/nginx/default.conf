server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Logs go to stdout/stderr so `docker logs` is the only place to look.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    # Cached assets are matched by directory, never by file extension.
    #
    # A rule like `location ~* \.js$ { try_files $uri =404; }` looks equivalent
    # and is not: it also catches `/livewire/livewire.min.js`, which Livewire
    # serves through a route rather than a file on disk. nginx answered 404, the
    # script never loaded, Alpine never booted, and every panel page rendered
    # blank behind its x-cloak — with a 200 status and nothing in the log.
    location ^~ /build/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(js|css|fonts)/filament/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
